<!doctype html>
<html lang="pt-BR">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luz sobre o relevo · Laboratório de motion</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="../shared/microinteracoes.css">
  <script type="module" src="./scene.js"></script>
  <main>
    <div class="track" data-track>
      <section class="stage" data-stage aria-labelledby="title">
        <div class="view">
          <img src="./media/poster.webp" width="640" height="360" alt="Placa de cerâmica com sulcos finos realçados por luz oblíqua.">
          <video muted playsinline preload="none" data-src="./media/argila.mp4" hidden aria-hidden="true"></video>
          <canvas width="640" height="360" hidden aria-hidden="true"></canvas>
        </div>
        <div class="copy">
          <h1 id="title" tabindex="-1">Luz sobre <em>o relevo.</em></h1>
          <p>A luz percorre a superfície. Observe a sombra de cada sulco.</p>
          <a class="action" data-action href="#relevo">Comparar a luz <span aria-hidden="true">↓</span></a>
        </div>
      </section>
    </div>
    <section class="proof" id="relevo" tabindex="-1" aria-labelledby="proof-title">
      <div>
        <h2 id="proof-title">O relevo muda com a incidência.</h2>
        <p>Compare a posição da faixa de luz. As cristas devolvem o brilho enquanto a sombra corre pelos sulcos.</p>
      </div>
      <div class="comparison">
        <figure>
          <img src="./frames/071.webp" width="640" height="360" alt="Luz concentrada à direita da mesma peça." loading="lazy">
          <figcaption>Fim da tomada · luz à direita</figcaption>
        </figure>
        <figure>
          <img src="./media/poster.webp" width="640" height="360" alt="Luz concentrada à esquerda." loading="lazy">
          <figcaption>Início da tomada · luz à esquerda</figcaption>
        </figure>
      </div>
      <a class="action" data-action href="#title">Rever a tomada <span aria-hidden="true">↑</span></a>
    </section>
  </main>
</html>
